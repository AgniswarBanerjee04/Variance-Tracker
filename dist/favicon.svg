<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dark Glassmorphic Container Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Geometric 'V' Gradient -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="48" cy="16" r="14" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>
  <circle cx="20" cy="48" r="14" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Geometric 'V' Structure -->
  <path d="M16 18 L32 48 L48 18" stroke="url(#vGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intertwined Upward Trend Line (Ascending Trajectory) -->
  <path d="M14 42 Q 25 36, 32 30 T 48 16" stroke="url(#trendGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Secondary Trend Line Endpoint -->
  <path d="M48 16 L52 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Analytics Nodes -->
  <!-- Midpoint Convergence Node -->
  <circle cx="32" cy="30" r="2.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Peak Analytics Node with Luminous Halo -->
  <circle cx="48" cy="16" r="4.5" fill="#06b6d4" opacity="0.4" filter="url(#glow)"/>
  <circle cx="48" cy="16" r="3" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
</svg>